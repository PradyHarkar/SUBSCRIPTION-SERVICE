name: Deploy Infrastructure and App

on:
  push:
    branches:
      - feature/dev-branch
      - test
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ github.ref_name }} # Get branch name (dev, test, or main)

      AZURE_CLIENT_ID: ${{ secrets['AZURE_CLIENT_ID_' + env.ENVIRONMENT] }}
      AZURE_TENANT_ID: ${{ secrets['AZURE_TENANT_ID_' + env.ENVIRONMENT] }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets['AZURE_SUBSCRIPTION_ID_' + env.ENVIRONMENT] }}
      AZURE_CLIENT_SECRET: ${{ secrets['AZURE_CLIENT_SECRET_' + env.ENVIRONMENT] }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var "environment=${{ env.ENVIRONMENT }}"