name: Deploy Infrastructure and App

on:
  push:
    branches:
      - feature/dev-branch
      - test
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ github.ref_name }} # Automatically gets branch name (e.g., feature/dev-branch)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set Working Directory
        run: cd ./infra # Update this path to where your Terraform files are located

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Set Environment Variables
        run: |
          if [[ "${{ env.ENVIRONMENT }}" == "feature/dev-branch" ]]; then
            echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID_DEV }}" >> $GITHUB_ENV
            echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID_DEV }}" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}" >> $GITHUB_ENV
            echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET_DEV }}" >> $GITHUB_ENV
          elif [[ "${{ env.ENVIRONMENT }}" == "test" ]]; then
            echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID_TEST }}" >> $GITHUB_ENV
            echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID_TEST }}" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID_TEST }}" >> $GITHUB_ENV
            echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET_TEST }}" >> $GITHUB_ENV
          elif [[ "${{ env.ENVIRONMENT }}" == "main" ]]; then
            echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID_MAIN }}" >> $GITHUB_ENV
            echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID_MAIN }}" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID_MAIN }}" >> $GITHUB_ENV
            echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET_MAIN }}" >> $GITHUB_ENV
          fi

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var "environment=${{ env.ENVIRONMENT }}"